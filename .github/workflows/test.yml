name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_native_startup.py
      - run: python -m mokuro_browser --version
      - run: python -m build
      - run: python tools/package_extension.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-pairing.mjs
      - run: npx --yes web-ext@8.4.0 lint --source-dir extension
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
