name: Standalone installers
on:
  push:
    branches: [main]
    paths: ['installer/**', 'tools/*installer*', 'src/**', 'extension/**', 'pyproject.toml', 'setup.py', '.github/workflows/installers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: ubuntu-22.04-arm
            label: linux-arm64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77,<81' build platformdirs Pillow certifi 'pyinstaller>=6.19,<7' uv==0.10.1
      - run: python tools/build_installer.py
      - name: Check desktop first launch and server lifecycle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/smoke_installer.py --gui-cycle
      - name: Check desktop first launch and server lifecycle on macOS
        if: runner.os == 'macOS'
        run: python tools/smoke_installer.py --gui-cycle
      - name: Check installer and server lifecycle on Windows
        if: runner.os == 'Windows'
        run: python tools/smoke_installer.py
      - name: Cache verified AppImage packaging tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/appimage-tools
          key: appimage-tools-${{ matrix.label }}-${{ hashFiles('tools/build_appimage_installer.py') }}
      - name: Build additional Linux AppImage
        if: runner.os == 'Linux'
        run: python tools/build_appimage_installer.py
      - name: Check AppImage install, update and uninstall without FUSE
        if: runner.os == 'Linux'
        run: python tools/smoke_installer.py --executable dist/MokuroBrowser-${{ matrix.label }}.AppImage --extract-and-run
      - name: Check GUI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a build/installer-dist/MokuroBrowser --gui-smoke-test
      - name: Check AppImage GUI without FUSE
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/MokuroBrowser-${{ matrix.label }}.AppImage --appimage-extract-and-run --gui-smoke-test
      - name: Check GUI on Windows and macOS
        if: runner.os != 'Linux'
        run: build/installer-dist/MokuroBrowser --gui-smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: dist/MokuroBrowser-*
